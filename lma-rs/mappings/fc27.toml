# Default mapping: EA SPORTS FC 27 roster CSV (Kaggle "EA SPORTS FC 27 Player Ratings" columns)
# -> LMA Manager 2007 squads. Data-free: only column names, position labels and club/nation
# name aliases. Copy it next to your mod and edit freely; `lma-cli squad-import` reads it.

season_start = "2026-07-01"
# The season the game itself starts in, written to the mod's mod.toml (#390: dates, season labels
# and contract years count from it). On since 10 Oct (decision timeout on the maintainer's question, the
# Mac's yes): the game boots to WED 1 JUL '26.
base_year = 2026
# GBP per unit of the stored value (#475's runtime): 5,000 lifts the cap from GBP 65.5m to 327.7m,
# so Transfermarkt values fit (the maintainer, 11 Oct: Yamal EUR 200m+, Saka 110m, values on the funds' scale)
value_unit = 5000
# gate receipts, sponsorship and prize money x4 (2006 -> 2026 club income; the maintainer, 11 Oct)
income_scale = 4.0
# a player is worth his stored (Transfermarkt) value, not the game's rating-based price (the maintainer, 11 Oct)
values_as_stored = true
# the board lends all of a club's funds for transfers, not 65% (#522; the maintainer, 11 Oct: offers capped at
# 80m of 198m), so the funds are the FC 27 budgets themselves (transfer_share below)
board_share = 1.0
# the clubs' weekly wage budget cap, GBP 3.2m in 2006, for real wages (wages.csv)
wage_budget_cap = 10000000
# the contract screen's most a club may offer a week by status (vanilla 100k / 50k / 25k / 10k /
# 10k / 5k: the maintainer's 100k board limit, 12 Oct); at most 524,287 (a 19-bit field)
contract_wage_ceilings = [500000, 300000, 150000, 80000, 40000, 20000]
# each club's wage budget is at least its real squad bill x this (wage_budgets.csv): room to offer
# and re-sign stars (the maintainer, 11 Oct: the board allowed ~100k)
wage_headroom = 1.5
max_squad = 32
# each club keeps its real squad up to max_squad, from spare player records while they last (#538)
real_squads = true
# and players beyond the 32 kept outside the squad array (squad_overflow.csv, #538)
squad_overflow = true

# players the live squads list at our clubs but FC 27 lacks are added from Transfermarkt (the maintainer, 12 Oct:
# "add some players not in the game like Max Dowman")
live_add_missing = true
# only players valued EUR 1m or more: each one added takes a spare record from a free agent
live_add_min_value_eur = 1000000
filter_column = "gender"
filter_value = "Men's Football"
# empty = every league in the roster file
leagues = []

[columns]
forename = "first_name"
surname = "last_name"
common_name = "common_name"
birthdate = "birthdate"
club = "club"
league = "league"
nationality = "nationality"
position = "position"
alt_positions = "alternate_positions"
overall = "overall_rating"
height_cm = "height_cm"
foot = "preferred_foot"
weak_foot = "weak_foot"

# LMA rating = average of the listed FC columns (1-99), or a constant.
[ratings]
tackling = ["defending_standing_tackle", "defending_sliding_tackle"]
marking = ["defending_awareness"]
passing = ["attacking_short_passing", "skill_long_passing"]
technique = ["skill_ball_control"]
dribbling = ["skill_dribbling", "movement_agility"]
shot_power = ["power_shot_power"]
shot_accuracy = ["attacking_finishing"]
heading = ["attacking_heading_accuracy"]
positioning = ["mentality_interceptions", "defending_awareness"]
runs = ["mentality_positioning"]
creativity = ["mentality_vision"]
pace = ["movement_acceleration", "movement_sprint_speed"]
intelligence = ["movement_reactions"]
temperament = ["mentality_composure"]
stamina = ["power_stamina"]
strength = ["power_strength"]
fitness = 95

# Goalkeepers reuse the outfield slots (lma-data RATINGS): reach=tackling, awareness=marking,
# distribution=passing, handling=technique, reflexes=shot_accuracy, aerial=heading, agility=pace.
[gk_ratings]
tackling = ["goalkeeping_diving"]
marking = ["goalkeeping_positioning"]
passing = ["goalkeeping_kicking"]
technique = ["goalkeeping_handling"]
dribbling = ["skill_dribbling"]
shot_power = ["power_shot_power"]
shot_accuracy = ["goalkeeping_reflexes"]
heading = ["goalkeeping_handling", "power_jumping"]
positioning = ["goalkeeping_positioning"]
runs = ["mentality_positioning"]
creativity = ["mentality_vision"]
pace = ["goalkeeping_diving", "movement_agility"]
intelligence = ["movement_reactions"]
temperament = ["mentality_composure"]
stamina = ["power_stamina"]
strength = ["power_strength"]
fitness = 95

[scale]
mul = 1.0
add = 0.0
# the spread (the maintainer, 21 Oct): the level the game sees is the source's overall through this curve
# (with overall_from_source): the top stretched (85 -> 86, 90 -> 93, 95 -> 99), the bottom lowered
# (60 -> 52, 55 -> 45), 75-80 as they are, so a 91 stands clear of an 80 and League Two of League One
curve = [[50, 38], [55, 45], [60, 52], [65, 59], [70, 66], [75, 73], [80, 80], [85, 86], [90, 93], [95, 99]]

