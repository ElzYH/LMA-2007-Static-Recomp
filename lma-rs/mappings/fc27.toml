# real-life values (the maintainer, 10 Oct: "real life", with club funds x4 by the mod's [[patch]] words):
# EUR -> GBP only, no 2006 discount; the field holds GBP 65.5m at most, so the top 43 sit there
value_scale = 0.85
# club funds (the maintainer, 10-11 Oct): each club's wealth tier is the nearest of these (GBP m, the bank
# balance it starts with) to its transfer budget (--budgets, FC 27's career mode) / transfer_share,
# else to budget_share of its live Transfermarkt squad value. The game makes funds tier word x 10 x
# its country's multiplier (40-175, England 150) and caps them at 999,999,999; the mod's [[patch]]
# words set every multiplier to 100 and tier k's word to wealth_budgets[k] x 1000.
wealth_budgets = [0.61, 1.65, 2.83, 4.36, 6.29, 9.12, 14.75, 19.55, 29.67, 43.34, 63.76, 91.24, 118.35, 175.27, 298.74, 394.28]
# the tier is also a club's stature for the AI: tiers by rank keep each country's 2006 spread (#704)
wealth_by_rank = true
budget_share = 0.15
# unmatched players get the median Transfermarkt value of matched peers (same group and overall)
fill_values = true
# with --weights (the game's overall weights): the overall the game shows is FC 27's (the maintainer, 11 Oct)
overall_from_source = true
# the online FC 27 lists as they are (the maintainer, 11 Oct, from the game: Arsenal and Spurs GBP 200m,
# Liverpool 250m, Brighton 75m)
budgets_scale = 1.0
# the board lends all of a club's funds for transfers, not 65%: the mod patches the share (a float
# Club_TransferBudgetGet reads; the Mac, 11 Oct; the maintainer: offers capped at 80m of 198m), so funds are
# the budgets themselves, no / 0.65
transfer_share = 1.0
# the game's own per-club funds multipliers (0x820eaa10), offset when picking the tier
funds_factors = { "Chelsea" = 2.0, "Celtic" = 0.8, "Rangers" = 0.8 }
# each club's Transfermarkt club (most of its matched players') gives its 2026 stadium: name and
# seats from the clubs file (--tm-clubs, dcaribou's clubs.csv; its 32 top flights)
club = "current_club_id"
# membership and managers from Transfermarkt over FC 27 / FM: off, its data ends with 2025/26
# (the maintainer's call pending, 10 Oct); its managers fill only clubs FM26 has none for
membership = false
managers_over_fm = false
