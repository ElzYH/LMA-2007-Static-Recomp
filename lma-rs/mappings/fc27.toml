# League ladders (#31 item 7). The game's leagues are club-id ranges (the Mac's proof, Agent sync
# 6096955231: England 0-19 Premiership, 20-43, 44-67, 68-91, 92-115), so the import moves each
# club it re-seats to an id in its new division (clubs.csv record_of, with that division's
# country and division bytes) and writes its squad there; fixtures are untouched.
# Each ladder: a country's divisions top to bottom as clubs.csv numbers them
# (lma-data's `country` / `division`), and the FC 27 league that fills each ("" = none in FC 27).
# Clubs FC 27 places in a ladder's league take places there; each division keeps its size, so
# clubs pushed below the bottom go to `overflow` (default [15, 12], the non-league pool).
# `comps`: the live Transfermarkt competition (`--tm-live`, tools/tm_live.py) that fills each
# division, over FC 27's league for a club both name (#699: live membership first); "" = none.
# A division bigger than the real league (Ligue 1 and 2 are 20 for 18, Serie B 22 for 20) keeps
# its spare places for clubs the sources have in no league; one smaller (Primeira Liga 16 for 18)
# drops the real league's last clubs to the division below.
[[ladders]]
country = 0
divisions = [0, 19, 20, 21, 11]
leagues = ["Premier League", "EFL Championship", "EFL League One", "EFL League Two", "National League"]
# the National League from the live squads too (CNAT): fc27final30 kept 2006's Conference
# (Rushden & Diamonds, Chester City, Grays, Northwich) instead of Woking, Wealdstone, Gateshead
comps = ["GB1", "GB2", "GB3", "GB4", "CNAT"]

