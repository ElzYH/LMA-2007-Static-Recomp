[workspace]
resolver = "2"
members = ["crates/lma-data", "crates/lma-cli", "crates/xex", "crates/ppc", "crates/guest", "crates/runtime", "crates/lma-app", "crates/recomp", "crates/game-blocks", "crates/lma-import"]

[workspace.package]
edition = "2021"
version = "0.1.0"

# Quick iteration on the recompiler or the guest crate: like release, but the 32 generated
# game-block parts (by far the slowest to compile) unoptimised. M4 Max: a guest change rebuilds
# in 26 s instead of 164 s; the game runs at ~210 instead of ~740 M instr/s. Benchmarks use
# --release. (opt-level 1 was slower to build than release for these huge functions.)
#   cargo build --profile fast-dev -p lma-cli -p lma-app   (output in target/fast-dev/)
[profile.fast-dev]
inherits = "release"

[profile.fast-dev.package.gb00]
opt-level = 0

