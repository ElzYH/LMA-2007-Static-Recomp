[package]
name = "lma-app"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bevy = "0.19"
cpal = "0.17"
runtime = { version = "0.1.0", path = "../runtime", features = ["wgpu"] }
game-blocks = { path = "../game-blocks" }
png = "0.17"
# the window icon (#766): winit's Icon type, the same winit bevy_winit uses
winit = { version = "0.30", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"
xex = { version = "0.1.0", path = "../xex" }
# the first run reads the player's disc (#766 b)
lma-data = { version = "0.1.0", path = "../lma-data" }

[features]
# Tracy profiler zones and frame marks (zero cost when off)
tracy = ["runtime/tracy"]
# XMA audio through FFmpeg (#199; see runtime's feature)
xma-ffmpeg = ["runtime/xma-ffmpeg"]

# the Dock icon from the player's own default.xex at run time (macOS): the same objc2 crates winit uses
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSData"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSImage", "NSResponder"] }
